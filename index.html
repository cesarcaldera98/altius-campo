<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Altius Campo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap');
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3347;--accent:#3b82f6;--accent2:#10b981;--warn:#f59e0b;--danger:#ef4444;--text:#f0f2ff;--text2:#8b90a7;--text3:#555c7a;--radius:16px;--radius-sm:10px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}
.hdr{padding:52px 20px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border);}
.hdr-back{width:36px;height:36px;border-radius:50%;background:var(--surface);border:none;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hdr-title{font-size:17px;font-weight:700;flex:1;}
.hdr-sub{font-size:12px;color:var(--text2);margin-top:1px;}
.logo-chip{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--accent);background:rgba(59,130,246,0.12);padding:3px 8px;border-radius:20px;}
.scroll-body{flex:1;overflow-y:auto;padding:16px 16px 110px;}
.section-label{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;margin:20px 0 10px;padding:0 4px;}
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all 0.15s;}
.client-card:active{transform:scale(0.97);background:var(--surface2);}
.client-avatar{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.client-info{flex:1;min-width:0;}
.client-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.client-meta{font-size:12px;color:var(--text2);margin-top:2px;}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;}
.tag-ferreteria{background:rgba(59,130,246,0.15);color:#60a5fa;}
.tag-muebleria{background:rgba(245,158,11,0.15);color:#fbbf24;}
.tag-plasticos{background:rgba(16,185,129,0.15);color:#34d399;}
.tag-blancos{background:rgba(168,85,247,0.15);color:#c084fc;}
.tag-minisuper{background:rgba(239,68,68,0.15);color:#f87171;}
.tag-pisos{background:rgba(20,184,166,0.15);color:#2dd4bf;}
.terr-hdr{display:flex;align-items:center;gap:8px;padding:6px 4px;margin:20px 0 8px;}
.terr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.terr-name{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;}
.search-wrap{position:relative;margin-bottom:4px;}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;padding:12px 16px 12px 40px;outline:none;}
.search-wrap input::placeholder{color:var(--text3);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px;pointer-events:none;}
.venta-client-banner{background:linear-gradient(135deg,#1e3a5f,#1a2d4a);border:1px solid rgba(59,130,246,0.3);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.client-notes-banner{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;font-size:13px;color:#fbbf24;line-height:1.5;}
.product-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
.product-row-top{display:flex;align-items:center;gap:14px;}
.product-emoji{font-size:26px;flex-shrink:0;}
.product-info{flex:1;min-width:0;}
.product-name{font-size:14px;font-weight:600;}
.product-sku{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px;}
.product-price-edit{font-size:12px;color:var(--accent2);font-weight:600;margin-top:4px;display:flex;align-items:center;gap:6px;}
.price-input{background:transparent;border:none;border-bottom:1px solid var(--accent2);color:var(--accent2);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;width:70px;outline:none;padding:1px 2px;}
.qty-ctrl{display:flex;align-items:center;background:var(--surface2);border-radius:12px;overflow:hidden;flex-shrink:0;}
.qty-btn{width:38px;height:38px;border:none;background:transparent;color:var(--text);font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-btn:active{background:var(--border);}
.qty-num{min-width:32px;text-align:center;font-family:'DM Mono',monospace;font-size:15px;font-weight:500;}
.qty-num.has-qty{color:var(--accent);font-weight:700;}
.notes-ta{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;padding:14px;resize:none;outline:none;min-height:90px;}
.notes-ta:focus{border-color:var(--accent);}
.notes-ta::placeholder{color:var(--text3);}
.bottom-btn-wrap{position:fixed;bottom:0;left:0;right:0;padding:12px 16px 28px;background:linear-gradient(to top,var(--bg) 70%,transparent);}
.btn-primary{width:100%;background:var(--accent);border:none;border-radius:var(--radius);color:white;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;padding:16px;cursor:pointer;transition:all 0.15s;}
.btn-primary:active{transform:scale(0.97);}
.btn-primary.green{background:var(--accent2);}
.btn-primary.danger{background:var(--danger);}
.btn-primary:disabled{opacity:0.4;}
.btn-sm{padding:8px 16px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.btn-sm.outline{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-sm.red{background:rgba(239,68,68,0.15);color:#f87171;}
.btn-sm.blue{background:rgba(59,130,246,0.15);color:#60a5fa;}
.summary-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.summary-total-row{background:linear-gradient(135deg,#1a3a2a,#162d22);border:1px solid rgba(16,185,129,0.3);border-radius:var(--radius);padding:16px;margin:16px 0;display:flex;justify-content:space-between;align-items:center;}
.summary-total-amt{font-size:22px;font-weight:700;color:var(--accent2);font-family:'DM Mono',monospace;}
.hist-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
.hist-card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.hist-client{font-size:15px;font-weight:700;}
.hist-date{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
.hist-total{font-size:16px;font-weight:700;color:var(--accent2);font-family:'DM Mono',monospace;}
.hist-products{font-size:12px;color:var(--text2);line-height:1.6;}
.prod-admin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.prod-admin-info{flex:1;min-width:0;}
.prod-admin-name{font-size:14px;font-weight:600;}
.prod-admin-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.prod-admin-price{font-size:13px;font-weight:600;color:var(--accent2);font-family:'DM Mono',monospace;margin-top:3px;}
.nav-tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 0 20px;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;cursor:pointer;border:none;background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;transition:color 0.15s;}
.nav-tab.active{color:var(--accent);}
.nav-tab-icon{font-size:22px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal-sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px 40px;max-height:88vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:20px;}
.input-field{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;padding:13px 14px;outline:none;margin-bottom:12px;}
.input-field:focus{border-color:var(--accent);}
.input-field::placeholder{color:var(--text3);}
select.input-field{-webkit-appearance:none;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent2);color:white;font-size:14px;font-weight:600;padding:12px 24px;border-radius:30px;opacity:0;transition:all 0.3s;pointer-events:none;z-index:100;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.red{background:var(--danger);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;}
.stat-val{font-size:22px;font-weight:700;font-family:'DM Mono',monospace;margin-bottom:4px;}
.stat-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.8px;}
.fab{position:fixed;bottom:80px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:white;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(59,130,246,0.4);z-index:20;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-state-icon{font-size:48px;margin-bottom:16px;}
.empty-state-text{font-size:15px;line-height:1.5;}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;}
.confirm-overlay.open{display:flex;}
.confirm-box{background:var(--surface);border-radius:20px;padding:24px;width:100%;max-width:320px;text-align:center;}
.confirm-title{font-size:17px;font-weight:700;margin-bottom:8px;}
.confirm-sub{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.5;}
.confirm-btns{display:flex;gap:12px;}
.confirm-btns button{flex:1;padding:13px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;}
.confirm-cancel{background:var(--surface2);color:var(--text);}
.confirm-delete{background:var(--danger);color:white;}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="hdr">
    <div style="flex:1"><div class="hdr-title">Altius Campo</div><div class="hdr-sub" id="hdr-date"></div></div>
    <div class="logo-chip">ALTIUS</div>
  </div>
  <div class="scroll-body">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Buscar cliente..." oninput="filterClients(this.value)">
    </div>
    <div id="clients-list"></div>
  </div>
  <button class="fab" onclick="openAddClient()">+</button>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showTab('home')"><span class="nav-tab-icon">👥</span>Clientes</button>
    <button class="nav-tab" onclick="showTab('historial')"><span class="nav-tab-icon">📋</span>Historial</button>
    <button class="nav-tab" onclick="showTab('resumen')"><span class="nav-tab-icon">📊</span>Resumen</button>
    <button class="nav-tab" onclick="showTab('admin')"><span class="nav-tab-icon">⚙️</span>Admin</button>
  </div>
</div>

<!-- HISTORIAL -->
<div class="screen" id="screen-historial">
  <div class="hdr">
    <div style="flex:1"><div class="hdr-title">Historial de Ventas</div><div class="hdr-sub" id="hist-count-label"></div></div>
  </div>
  <div class="scroll-body" id="historial-list"></div>
  <div class="nav-tabs">
    <button class="nav-tab" onclick="showTab('home')"><span class="nav-tab-icon">👥</span>Clientes</button>
    <button class="nav-tab active" onclick="showTab('historial')"><span class="nav-tab-icon">📋</span>Historial</button>
    <button class="nav-tab" onclick="showTab('resumen')"><span class="nav-tab-icon">📊</span>Resumen</button>
    <button class="nav-tab" onclick="showTab('admin')"><span class="nav-tab-icon">⚙️</span>Admin</button>
  </div>
</div>

<!-- RESUMEN -->
<div class="screen" id="screen-resumen">
  <div class="hdr">
    <div style="flex:1"><div class="hdr-title">Resumen del Día</div><div class="hdr-sub" id="resumen-date"></div></div>
  </div>
  <div class="scroll-body" id="resumen-body"></div>
  <div class="nav-tabs">
    <button class="nav-tab" onclick="showTab('home')"><span class="nav-tab-icon">👥</span>Clientes</button>
    <button class="nav-tab" onclick="showTab('historial')"><span class="nav-tab-icon">📋</span>Historial</button>
    <button class="nav-tab active" onclick="showTab('resumen')"><span class="nav-tab-icon">📊</span>Resumen</button>
    <button class="nav-tab" onclick="showTab('admin')"><span class="nav-tab-icon">⚙️</span>Admin</button>
  </div>
</div>

<!-- ADMIN -->
<div class="screen" id="screen-admin">
  <div class="hdr">
    <div style="flex:1"><div class="hdr-title">Administrador</div><div class="hdr-sub">Productos y configuración</div></div>
  </div>
  <div class="scroll-body">
    <div class="section-label">Catálogo de Productos</div>
    <div id="admin-products-list"></div>
    <button class="btn-primary" style="margin-top:8px" onclick="openAddProduct()">+ Agregar producto</button>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab" onclick="showTab('home')"><span class="nav-tab-icon">👥</span>Clientes</button>
    <button class="nav-tab" onclick="showTab('historial')"><span class="nav-tab-icon">📋</span>Historial</button>
    <button class="nav-tab" onclick="showTab('resumen')"><span class="nav-tab-icon">📊</span>Resumen</button>
    <button class="nav-tab active" onclick="showTab('admin')"><span class="nav-tab-icon">⚙️</span>Admin</button>
  </div>
</div>

<!-- VENTA -->
<div class="screen" id="screen-venta">
  <div class="hdr">
    <button class="hdr-back" onclick="goBack()">←</button>
    <div style="flex:1"><div class="hdr-title" id="venta-title"></div><div class="hdr-sub" id="venta-sub"></div></div>
    <button class="btn-sm blue" onclick="openEditClient()">✏️ Editar</button>
  </div>
  <div class="scroll-body">
    <div class="venta-client-banner" id="venta-banner"></div>
    <div id="client-notes-area"></div>
    <div class="section-label">Productos — toca precio para editarlo</div>
    <div id="products-list"></div>
    <div style="margin-top:20px">
      <div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px">💬 Notas del cliente</div>
      <textarea class="notes-ta" id="venta-notes" placeholder="Ej: Le gustó el cortinero grande. Preguntó por cubetas..."></textarea>
    </div>
  </div>
  <div class="bottom-btn-wrap">
    <button class="btn-primary green" id="btn-guardar" onclick="guardarVenta()" disabled>Guardar venta</button>
  </div>
</div>

<!-- SUMMARY CONFIRM -->
<div class="screen" id="screen-summary">
  <div class="hdr">
    <button class="hdr-back" onclick="showScreen('screen-venta')">←</button>
    <div style="flex:1"><div class="hdr-title">Confirmar Venta</div></div>
  </div>
  <div class="scroll-body"><div id="summary-content"></div></div>
  <div class="bottom-btn-wrap">
    <button class="btn-primary green" onclick="confirmarVenta()">✓ Confirmar y Guardar</button>
  </div>
</div>

<!-- MODAL ADD CLIENT -->
<div class="modal-overlay" id="modal-add-client" onclick="closeModal('modal-add-client',event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">➕ Agregar Cliente</div>
    <input class="input-field" id="nc-nombre" placeholder="Nombre del negocio *">
    <input class="input-field" id="nc-contacto" placeholder="Nombre del dueño / contacto">
    <input class="input-field" id="nc-tel" placeholder="Teléfono(s)">
    <select class="input-field" id="nc-tipo" onchange="toggleOtro('nc-tipo','nc-tipo-otro')">
      <option value="">Tipo de negocio...</option>
      <option>Ferretería</option><option>Mueblería</option><option>Plásticos</option>
      <option>Tienda de blancos</option><option>Minisuper</option><option>Pisos y azulejos</option><option>Otro</option>
    </select>
    <input class="input-field" id="nc-tipo-otro" placeholder="Escribe el tipo de negocio..." style="display:none">
    <select class="input-field" id="nc-territorio" onchange="toggleOtro('nc-territorio','nc-territorio-otro')">
      <option value="">Territorio / Municipio...</option>
      <option>Tepetongo, Zac.</option><option>Huejúcar, Jal.</option>
      <option>Monte Escobedo, Zac.</option><option>Mezquitic, Jal.</option>
      <option>Huejuquilla el Alto, Jal.</option><option>Valparaíso, Zac.</option>
      <option>Fresnillo, Zac.</option><option>Aguascalientes, Ags.</option>
      <option>Sombrerete, Zac.</option><option>Vicente Guerrero, Dgo.</option>
      <option>Durango, Dgo.</option><option>Otro</option>
    </select>
    <input class="input-field" id="nc-territorio-otro" placeholder="Escribe el municipio / ciudad..." style="display:none">
    <input class="input-field" id="nc-dir" placeholder="Dirección (opcional)">
    <textarea class="input-field" id="nc-notas" placeholder="Notas fijas del cliente..." style="min-height:70px;resize:none"></textarea>
    <button class="btn-primary" onclick="saveNewClient()">Guardar cliente</button>
  </div>
</div>

<!-- MODAL EDIT CLIENT -->
<div class="modal-overlay" id="modal-edit-client" onclick="closeModal('modal-edit-client',event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ Editar Cliente</div>
    <input class="input-field" id="ec-nombre" placeholder="Nombre del negocio *">
    <input class="input-field" id="ec-contacto" placeholder="Nombre del dueño / contacto">
    <input class="input-field" id="ec-tel" placeholder="Teléfono(s)">
    <select class="input-field" id="ec-tipo" onchange="toggleOtro('ec-tipo','ec-tipo-otro')">
      <option value="">Tipo de negocio...</option>
      <option>Ferretería</option><option>Mueblería</option><option>Plásticos</option>
      <option>Tienda de blancos</option><option>Minisuper</option><option>Pisos y azulejos</option><option>Otro</option>
    </select>
    <input class="input-field" id="ec-tipo-otro" placeholder="Escribe el tipo de negocio..." style="display:none">
    <select class="input-field" id="ec-territorio" onchange="toggleOtro('ec-territorio','ec-territorio-otro')">
      <option value="">Territorio / Municipio...</option>
      <option>Tepetongo, Zac.</option><option>Huejúcar, Jal.</option>
      <option>Monte Escobedo, Zac.</option><option>Mezquitic, Jal.</option>
      <option>Huejuquilla el Alto, Jal.</option><option>Valparaíso, Zac.</option>
      <option>Fresnillo, Zac.</option><option>Aguascalientes, Ags.</option>
      <option>Sombrerete, Zac.</option><option>Vicente Guerrero, Dgo.</option>
      <option>Durango, Dgo.</option><option>Otro</option>
    </select>
    <input class="input-field" id="ec-territorio-otro" placeholder="Escribe el municipio / ciudad..." style="display:none">
    <input class="input-field" id="ec-dir" placeholder="Dirección (opcional)">
    <textarea class="input-field" id="ec-notas" placeholder="Notas fijas del cliente..." style="min-height:70px;resize:none"></textarea>
    <button class="btn-primary" onclick="saveEditClient()">Guardar cambios</button>
    <button class="btn-primary danger" style="margin-top:12px" onclick="askDeleteClientEdit()">🗑 Eliminar cliente</button>
  </div>
</div>

<!-- MODAL ADD PRODUCT -->
<div class="modal-overlay" id="modal-add-product" onclick="closeModal('modal-add-product',event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">➕ Agregar Producto</div>
    <input class="input-field" id="np-nombre" placeholder="Nombre del producto *">
    <input class="input-field" id="np-sub" placeholder="Descripción corta (tamaño, material...)">
    <input class="input-field" id="np-sku" placeholder="SKU / Código (opcional)">
    <input class="input-field" id="np-emoji" placeholder="Emoji (ej: 🔧, 🚿, 📏)">
    <input class="input-field" id="np-precio" placeholder="Precio de venta ($0 si varía)" type="number" step="0.01">
    <button class="btn-primary" onclick="saveNewProduct()">Guardar producto</button>
  </div>
</div>

<!-- CONFIRM -->

// ── BUG 1: toggleOtro muestra campo libre cuando seleccionan "Otro" ──
function toggleOtro(selId,inpId){
  const v=document.getElementById(selId).value;
  const inp=document.getElementById(inpId);
  inp.style.display=(v==='Otro')?'block':'none';
  if(v==='Otro') inp.focus(); else inp.value='';
}
function resolveVal(selId,inpId){
  const sel=document.getElementById(selId);
  if(sel.value==='Otro'){const v=document.getElementById(inpId).value.trim();return v||'Otro';}
  return sel.value;
}

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
function showTab(tab){
  if(tab==='home'){renderClients();showScreen('screen-home');}
  if(tab==='historial'){renderHistorial();showScreen('screen-historial');}
  if(tab==='resumen'){renderResumen();showScreen('screen-resumen');}
  if(tab==='admin'){renderAdmin();showScreen('screen-admin');}
}
function goBack(){showScreen('screen-home');renderClients();}

function fmtDate(d){const dy=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],mo=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return `${dy[d.getDay()]} ${d.getDate()} ${mo[d.getMonth()]} ${d.getFullYear()}`;}
function fmtDateTime(ts){const d=new Date(ts);return `${fmtDate(d)} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;}
function getTerrColor(t){return TERR_COLORS[t]||'#6b7280';}

function renderClients(filter=''){
  document.getElementById('hdr-date').textContent=fmtDate(new Date());
  const f=filter.toLowerCase();
  const filtered=clients.filter(c=>c.name.toLowerCase().includes(f)||(c.contact||'').toLowerCase().includes(f)||(c.territorio||'').toLowerCase().includes(f));
  const grouped={};
  filtered.forEach(c=>{const t=c.territorio||'Sin territorio';if(!grouped[t])grouped[t]=[];grouped[t].push(c);});
  if(!filtered.length){document.getElementById('clients-list').innerHTML='<div class="empty-state"><div class="empty-state-icon">👀</div><div class="empty-state-text">No se encontraron clientes.</div></div>';return;}
  let html='';
  Object.entries(grouped).forEach(([terr,cls])=>{
    const color=getTerrColor(terr);
    html+=`<div class="terr-hdr"><div class="terr-dot" style="background:${color}"></div><div class="terr-name">${terr}</div></div>`;
    cls.forEach(c=>{
      const last=[...ventas].reverse().find(v=>v.clientId===c.id);
      const lastStr=last?`Última visita: ${fmtDate(new Date(last.ts))}`:'Sin visitas registradas';
      html+=`<div class="client-card" onclick="openVenta('${c.id}')">
        <div class="client-avatar" style="background:linear-gradient(135deg,${color},${color}88)">${TYPE_EMOJI[c.tipo]||'🏢'}</div>
        <div class="client-info">
          <div class="client-name">${c.name}</div>
          <div class="client-meta"><span class="tag ${TYPE_TAGS[c.tipo]||'tag-ferreteria'}">${c.tipo||'Otro'}</span>${c.contact?' · '+c.contact:''}</div>
          <div class="client-meta" style="margin-top:3px">${lastStr}</div>
        </div>
        <div style="color:var(--text3);font-size:16px">›</div>
      </div>`;
    });
  });
  document.getElementById('clients-list').innerHTML=html;
}
function filterClients(v){renderClients(v);}

function openVenta(clientId){
  currentClientId=clientId;quantities={};customPrices={};
  const c=clients.find(x=>x.id===clientId);
  document.getElementById('venta-title').textContent=c.name;
  document.getElementById('venta-sub').textContent=c.territorio||'';
  document.getElementById('venta-notes').value='';
  const color=getTerrColor(c.territorio);
  document.getElementById('venta-banner').innerHTML=`
    <div style="font-size:11px;color:${color};font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:6px">${c.territorio||''}</div>
    <div style="font-size:18px;font-weight:700">${c.name}</div>
    <div style="font-size:13px;color:#93c5fd;margin-top:4px">${c.contact||''}${c.tel?' · '+c.tel:''}</div>`;
  document.getElementById('client-notes-area').innerHTML=c.notas?`<div class="client-notes-banner">⭐ ${c.notas}</div>`:'';
  renderProductsVenta();
  showScreen('screen-venta');
}

function renderProductsVenta(){
  document.getElementById('products-list').innerHTML=products.map(p=>{
    const price=customPrices[p.id]!==undefined?customPrices[p.id]:p.price;
    return `<div class="product-row">
      <div class="product-row-top">
        <div class="product-emoji">${p.emoji||'📦'}</div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-sku">${p.sub||''}${p.sku?' · '+p.sku:''}</div>
          <div class="product-price-edit">$<input class="price-input" id="price-${p.id}" type="number" step="0.01" value="${price>0?price.toFixed(2):'0.00'}" onchange="updatePrice('${p.id}',this.value)" onclick="this.select()"><span style="color:var(--text3)">c/u</span></div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('${p.id}',-1)">−</button>
          <div class="qty-num" id="qty-${p.id}">0</div>
          <button class="qty-btn" onclick="changeQty('${p.id}',1)">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function changeQty(pid,delta){
  quantities[pid]=Math.max(0,(quantities[pid]||0)+delta);
  const el=document.getElementById('qty-'+pid);
  el.textContent=quantities[pid];
  el.className='qty-num'+(quantities[pid]>0?' has-qty':'');
  document.getElementById('btn-guardar').disabled=!Object.values(quantities).some(q=>q>0);
}
function updatePrice(pid,val){customPrices[pid]=parseFloat(val)||0;}

// ── BUG 2: Editar cliente ──
function openEditClient(){
  const c=clients.find(x=>x.id===currentClientId);if(!c)return;
  document.getElementById('ec-nombre').value=c.name;
  document.getElementById('ec-contacto').value=c.contact||'';
  document.getElementById('ec-tel').value=c.tel||'';
  document.getElementById('ec-dir').value=c.dir||'';
  document.getElementById('ec-notas').value=c.notas||'';
  const tipoSel=document.getElementById('ec-tipo');
  const tipoInp=document.getElementById('ec-tipo-otro');
  if(KNOWN_TIPOS.includes(c.tipo)){tipoSel.value=c.tipo;tipoInp.style.display='none';tipoInp.value='';}
  else{tipoSel.value='Otro';tipoInp.style.display='block';tipoInp.value=c.tipo||'';}
  const terrSel=document.getElementById('ec-territorio');
  const terrInp=document.getElementById('ec-territorio-otro');
  if(KNOWN_TERRS.includes(c.territorio)){terrSel.value=c.territorio;terrInp.style.display='none';terrInp.value='';}
  else{terrSel.value='Otro';terrInp.style.display='block';terrInp.value=c.territorio||'';}
  document.getElementById('modal-edit-client').classList.add('open');
}

function saveEditClient(){
  const name=document.getElementById('ec-nombre').value.trim();
  if(!name){showToast('⚠ Escribe el nombre');return;}
  const idx=clients.findIndex(x=>x.id===currentClientId);if(idx===-1)return;
  clients[idx]={...clients[idx],
    name,
    contact:document.getElementById('ec-contacto').value.trim(),
    tel:document.getElementById('ec-tel').value.trim(),
    tipo:resolveVal('ec-tipo','ec-tipo-otro')||'Otro',
    territorio:resolveVal('ec-territorio','ec-territorio-otro')||'Sin territorio',
    dir:document.getElementById('ec-dir').value.trim(),
    notas:document.getElementById('ec-notas').value.trim(),
  };
  save();
  closeModal('modal-edit-client');
  showToast('✓ Cliente actualizado');
  openVenta(currentClientId);
}

function askDeleteClientEdit(){
  const c=clients.find(x=>x.id===currentClientId);
  closeModal('modal-edit-client');
  document.getElementById('confirm-title').textContent='¿Eliminar este cliente?';
  document.getElementById('confirm-sub').textContent=(c?.name||'')+' — se eliminará permanentemente.';
  document.getElementById('confirm-ok-btn').onclick=()=>deleteClient(currentClientId);
  document.getElementById('confirm-overlay').classList.add('open');
}
function deleteClient(id){clients=clients.filter(c=>c.id!==id);save();closeConfirm();showToast('Cliente eliminado','red');showTab('home');}

function guardarVenta(){
  const c=clients.find(x=>x.id===currentClientId);
  const items=products.filter(p=>(quantities[p.id]||0)>0).map(p=>{const price=customPrices[p.id]!==undefined?customPrices[p.id]:p.price;return {...p,qty:quantities[p.id],price};});
  const total=items.reduce((s,p)=>s+p.price*p.qty,0);
  const notes=document.getElementById('venta-notes').value.trim();
  let html=`<div class="venta-client-banner" style="margin-bottom:16px"><div style="font-size:18px;font-weight:700">${c.name}</div><div style="font-size:13px;color:#93c5fd;margin-top:4px">${fmtDate(new Date())} · ${c.territorio||''}</div></div><div class="section-label">Productos</div>`;
  items.forEach(p=>{html+=`<div class="summary-item"><div><div style="font-size:14px;font-weight:500">${p.emoji||'📦'} ${p.name} ${p.sub}</div><div style="font-size:12px;color:var(--text2)">${p.qty} pzs × $${p.price.toFixed(2)}</div></div><div style="font-size:15px;font-weight:700;color:var(--accent2);font-family:'DM Mono',monospace">$${(p.price*p.qty).toFixed(2)}</div></div>`;});
  html+=`<div class="summary-total-row"><div style="font-size:14px;font-weight:600;color:#6ee7b7">Total de la venta</div><div class="summary-total-amt">$${total.toFixed(2)}</div></div>`;
  if(notes)html+=`<div class="section-label">Notas</div><div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:14px;color:var(--text2);line-height:1.6">💬 ${notes}</div>`;
  document.getElementById('summary-content').innerHTML=html;
  showScreen('screen-summary');
}

function confirmarVenta(){
  const items=products.filter(p=>(quantities[p.id]||0)>0).map(p=>{const price=customPrices[p.id]!==undefined?customPrices[p.id]:p.price;return {id:p.id,name:p.name,sub:p.sub,sku:p.sku,emoji:p.emoji,price,qty:quantities[p.id]};});
  ventas.push({id:'v'+Date.now(),clientId:currentClientId,ts:Date.now(),items,total:items.reduce((s,p)=>s+p.price*p.qty,0),notes:document.getElementById('venta-notes').value.trim()});
  save();showToast('✓ Venta guardada');showTab('home');
}

function renderHistorial(){
  const sorted=[...ventas].reverse();
  document.getElementById('hist-count-label').textContent=`${ventas.length} venta${ventas.length!==1?'s':''} registrada${ventas.length!==1?'s':''}`;
  if(!sorted.length){document.getElementById('historial-list').innerHTML='<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">Sin ventas todavía.</div></div>';return;}
  document.getElementById('historial-list').innerHTML=sorted.map(v=>{
    const c=clients.find(x=>x.id===v.clientId)||{name:'Cliente eliminado',territorio:''};
    const prods=v.items.map(i=>`${i.emoji||'📦'} ${i.name} ×${i.qty}`).join(' · ');
    return `<div class="hist-card">
      <div class="hist-card-hdr">
        <div><div class="hist-client">${c.name}</div><div class="hist-date">${fmtDateTime(v.ts)} · ${c.territorio||''}</div></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
          <div class="hist-total">$${v.total.toFixed(2)}</div>
          <button class="btn-sm red" onclick="askDeleteVenta('${v.id}')">🗑 Eliminar</button>
        </div>
      </div>
      <div class="hist-products">${prods}</div>
      ${v.notes?`<div style="margin-top:8px;font-size:12px;color:var(--text3);border-top:1px solid var(--border);padding-top:8px">💬 ${v.notes}</div>`:''}
    </div>`;
  }).join('');
}

function askDeleteVenta(id){
  const v=ventas.find(x=>x.id===id);const c=clients.find(x=>x.id===v?.clientId);
  document.getElementById('confirm-title').textContent='¿Eliminar esta venta?';
  document.getElementById('confirm-sub').textContent=`${c?.name||'Cliente'} · $${v?.total?.toFixed(2)||'0.00'}`;
  document.getElementById('confirm-ok-btn').onclick=()=>{ventas=ventas.filter(v=>v.id!==id);save();closeConfirm();showToast('Venta eliminada','red');renderHistorial();};
  document.getElementById('confirm-overlay').classList.add('open');
}

function renderResumen(){
  const now=new Date();
  document.getElementById('resumen-date').textContent=fmtDate(now);
  const todayStr=now.toDateString();
  const hoy=ventas.filter(v=>new Date(v.ts).toDateString()===todayStr);
  const totalHoy=hoy.reduce((s,v)=>s+v.total,0);
  const totalAll=ventas.reduce((s,v)=>s+v.total,0);
  const prodCount={};
  hoy.forEach(v=>v.items.forEach(i=>{if(!prodCount[i.name])prodCount[i.name]={qty:0,emoji:i.emoji};prodCount[i.name].qty+=i.qty;}));
  let html=`<div class="stat-grid">
    <div class="stat-card"><div class="stat-val" style="color:var(--accent2)">$${totalHoy.toFixed(0)}</div><div class="stat-label">Hoy</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--accent)">$${totalAll.toFixed(0)}</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--warn)">${hoy.length}</div><div class="stat-label">Ventas hoy</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--text2)">${ventas.length}</div><div class="stat-label">Total ventas</div></div>
  </div>`;
  if(Object.keys(prodCount).length){
    html+='<div class="section-label">Productos vendidos hoy</div>';
    Object.entries(prodCount).sort((a,b)=>b[1].qty-a[1].qty).forEach(([name,d])=>{html+=`<div class="summary-item"><div style="font-size:14px;font-weight:500">${d.emoji||'📦'} ${name}</div><div style="font-family:'DM Mono',monospace;font-size:14px;font-weight:700;color:var(--accent)">${d.qty} pzs</div></div>`;});
  }
  if(hoy.length){
    html+='<div class="section-label" style="margin-top:20px">Clientes visitados hoy</div>';
    hoy.forEach(v=>{const c=clients.find(x=>x.id===v.clientId)||{name:'?',territorio:''};html+=`<div class="summary-item"><div><div style="font-size:14px;font-weight:500">${c.name}</div><div style="font-size:12px;color:var(--text2)">${c.territorio||''}</div></div><div style="font-family:'DM Mono',monospace;font-size:14px;font-weight:700;color:var(--accent2)">$${v.total.toFixed(2)}</div></div>`;});
    html+=`<div style="margin-top:24px"><button class="btn-primary" style="background:var(--warn);color:#000" onclick="exportWhatsApp()">📤 Exportar resumen por WhatsApp</button></div>`;
  } else {
    html+='<div class="empty-state"><div class="empty-state-icon">☀️</div><div class="empty-state-text">Sin ventas hoy todavía.<br>¡A vender!</div></div>';
  }
  document.getElementById('resumen-body').innerHTML=html;
}

function exportWhatsApp(){
  const todayStr=new Date().toDateString();
  const hoy=ventas.filter(v=>new Date(v.ts).toDateString()===todayStr);
  if(!hoy.length){showToast('Sin ventas hoy');return;}
  const totalHoy=hoy.reduce((s,v)=>s+v.total,0);
  let msg=`*ALTIUS — Reporte del día*\n${fmtDate(new Date())}\n\n`;
  hoy.forEach(v=>{const c=clients.find(x=>x.id===v.clientId)||{name:'?'};msg+=`📍 *${c.name}*\n`;v.items.forEach(i=>{msg+=`  ${i.emoji||'·'} ${i.name} ${i.sub} × ${i.qty} = $${(i.price*i.qty).toFixed(2)}\n`;});if(v.notes)msg+=`  💬 ${v.notes}\n`;msg+=`  Subtotal: $${v.total.toFixed(2)}\n\n`;});
  msg+=`*TOTAL DEL DÍA: $${totalHoy.toFixed(2)}*\n${hoy.length} cliente${hoy.length!==1?'s':''} visitado${hoy.length!==1?'s':''}`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function renderAdmin(){
  document.getElementById('admin-products-list').innerHTML=products.map(p=>`<div class="prod-admin-card">
    <div style="font-size:28px">${p.emoji||'📦'}</div>
    <div class="prod-admin-info"><div class="prod-admin-name">${p.name}</div><div class="prod-admin-sub">${p.sub||''}${p.sku?' · '+p.sku:''}</div><div class="prod-admin-price">$${p.price>0?p.price.toFixed(2):'Precio variable'}</div></div>
    <button class="btn-sm red" onclick="askDeleteProduct('${p.id}')">🗑</button>
  </div>`).join('')||'<div style="color:var(--text3);font-size:14px;padding:20px 0">Sin productos</div>';
}

function openAddProduct(){['np-nombre','np-sub','np-sku','np-emoji','np-precio'].forEach(id=>document.getElementById(id).value='');document.getElementById('modal-add-product').classList.add('open');}
function saveNewProduct(){
  const name=document.getElementById('np-nombre').value.trim();
  if(!name){showToast('⚠ Escribe el nombre');return;}
  products.push({id:'p'+Date.now(),name,sub:document.getElementById('np-sub').value.trim(),sku:document.getElementById('np-sku').value.trim(),emoji:document.getElementById('np-emoji').value.trim()||'📦',price:parseFloat(document.getElementById('np-precio').value)||0});
  save();closeModal('modal-add-product');showToast('✓ Producto agregado');renderAdmin();
}
function askDeleteProduct(id){
  const p=products.find(x=>x.id===id);
  document.getElementById('confirm-title').textContent='¿Eliminar este producto?';
  document.getElementById('confirm-sub').textContent=`${p?.emoji||'📦'} ${p?.name||''} — desaparecerá del catálogo.`;
  document.getElementById('confirm-ok-btn').onclick=()=>{products=products.filter(p=>p.id!==id);save();closeConfirm();showToast('Producto eliminado','red');renderAdmin();};
  document.getElementById('confirm-overlay').classList.add('open');
}

function openAddClient(){
  ['nc-nombre','nc-contacto','nc-tel','nc-dir','nc-notas','nc-tipo-otro','nc-territorio-otro'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('nc-tipo').value='';document.getElementById('nc-territorio').value='';
  document.getElementById('nc-tipo-otro').style.display='none';document.getElementById('nc-territorio-otro').style.display='none';
  document.getElementById('modal-add-client').classList.add('open');
}
function saveNewClient(){
  const name=document.getElementById('nc-nombre').value.trim();
  if(!name){showToast('⚠ Escribe el nombre');return;}
  clients.push({id:'c'+Date.now(),name,contact:document.getElementById('nc-contacto').value.trim(),tel:document.getElementById('nc-tel').value.trim(),tipo:resolveVal('nc-tipo','nc-tipo-otro')||'Otro',territorio:resolveVal('nc-territorio','nc-territorio-otro')||'Sin territorio',dir:document.getElementById('nc-dir').value.trim(),notas:document.getElementById('nc-notas').value.trim()});
  save();closeModal('modal-add-client');showToast('✓ Cliente agregado');renderClients();
}

function closeModal(id,e){if(!e||e.target===document.getElementById(id))document.getElementById(id).classList.remove('open');}
function closeConfirm(){document.getElementById('confirm-overlay').classList.remove('open');}
function showToast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(type?' '+type:'')+' show';setTimeout(()=>t.classList.remove('show'),2500);}

renderClients();
</script>
</body>
</html>
